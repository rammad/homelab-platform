apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tiastube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/homelab-platform.git
    targetRevision: master
    path: cluster/apps/tiastube
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
