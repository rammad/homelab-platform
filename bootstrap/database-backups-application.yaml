apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-backups
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/homelab-platform.git
    targetRevision: master
    path: cluster/infrastructure/backups
  destination:
    server: https://kubernetes.default.svc
    namespace: backups
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - FailOnSharedResource=true
