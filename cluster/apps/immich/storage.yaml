# 1. Immich Database Storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-db-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /mnt/application-pool/k3s-app-data/immich-db
    server: 192.0.2.30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-pvc
  namespace: data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: immich-db-pv
---
# 2. Existing Immich Photo Storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-storage-pv
spec:
  capacity:
    storage: 100Gi # K3s will just use whatever space TrueNAS has
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /mnt/application-pool/configs/immich/storage
    server: 192.0.2.30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-storage-pvc
  namespace: data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: immich-storage-pv
