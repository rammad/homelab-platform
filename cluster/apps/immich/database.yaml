apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine@sha256:c9ab371a96b057d3642be9bd71cb1b3fe97920d345dc949860578bffb3d54460
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-db
  namespace: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-db
  template:
    metadata:
      labels:
        app: immich-db
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.5.3-pgvector0.8.1@sha256:5c87f5bf7fdd6d707a04e2594905316d34fe09baa4a86f292928a4878c5eb698
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: immich-credentials
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: immich-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: immich-db-data
          persistentVolumeClaim:
            claimName: immich-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: data
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: immich-db
  namespace: data
spec:
  selector:
    app: immich-db
  ports:
    - port: 5432
