apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: speedtest-edge
  namespace: tools
spec:
  secretName: speedtest-edge-tls
  dnsNames:
  - speedtest.example.com
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speedtest-edge-https
  namespace: tools
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.options: tools-speedtest-http1@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - speedtest.example.com
    secretName: speedtest-edge-tls
  rules:
  - host: speedtest.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openspeedtest
            port:
              number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: speedtest-http1
  namespace: tools
spec:
  minVersion: VersionTLS12
  alpnProtocols:
  - http/1.1
