apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unpackerr
  template:
    metadata:
      labels:
        app: unpackerr
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: control-plane
      containers:
      - name: unpackerr
        image: golift/unpackerr@sha256:fc8b69571033f197d4db5cf22a573acb3bb891c9f8033431b9a1fcf679ca3e9c
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          allowPrivilegeEscalation: false
        env:
        - name: TZ
          value: "America/New_York"
        - name: UN_DEBUG
          value: "false"
        - name: UN_QUIET
          value: "false"
        - name: UN_ERROR_STDERR
          value: "false"
        - name: UN_ACTIVITY
          value: "false"
        - name: UN_LOG_QUEUES
          value: "1m"
        - name: UN_LOG_FILE
          value: "/media-data/downloads/unpackerr.log"
        - name: UN_LOG_FILES
          value: "10"
        - name: UN_LOG_FILE_MB
          value: "10"
        - name: UN_LOG_FILE_MODE
          value: "0600"
        - name: UN_INTERVAL
          value: "2m"
        - name: UN_START_DELAY
          value: "1m"
        - name: UN_RETRY_DELAY
          value: "5m"
        - name: UN_MAX_RETRIES
          value: "3"
        - name: UN_PARALLEL
          value: "1"
        - name: UN_FILE_MODE
          value: "0644"
        - name: UN_DIR_MODE
          value: "0755"
        - name: UN_FOLDERS_INTERVAL
          value: "1s"
        - name: UN_FOLDERS_BUFFER
          value: "20000"
        - name: UN_SONARR_0_URL
          value: "http://sonarr.media.svc.cluster.local:8989"
        - name: UN_SONARR_0_PATHS_0
          value: "/media-data/downloads"
        - name: UN_SONARR_0_PROTOCOLS
          value: "torrent,usenet"
        - name: UN_SONARR_0_TIMEOUT
          value: "10s"
        - name: UN_SONARR_0_DELETE_DELAY
          value: "5m"
        - name: UN_SONARR_0_DELETE_ORIG
          value: "false"
        - name: UN_SONARR_0_SYNCTHING
          value: "false"
        - name: UN_RADARR_0_URL
          value: "http://radarr.media.svc.cluster.local:7878"
        - name: UN_RADARR_0_PATHS_0
          value: "/media-data/downloads"
        - name: UN_RADARR_0_PROTOCOLS
          value: "torrent,usenet"
        - name: UN_RADARR_0_TIMEOUT
          value: "10s"
        - name: UN_RADARR_0_DELETE_DELAY
          value: "5m"
        - name: UN_RADARR_0_DELETE_ORIG
          value: "false"
        - name: UN_RADARR_0_SYNCTHING
          value: "false"
        - name: UN_SONARR_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unpackerr-credentials
              key: UN_SONARR_0_API_KEY
        - name: UN_RADARR_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unpackerr-credentials
              key: UN_RADARR_0_API_KEY
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media-data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: unpackerr-config
      - name: media
        persistentVolumeClaim:
          claimName: arr-media
