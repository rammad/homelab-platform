apiVersion: v1
kind: PersistentVolume
metadata:
  name: tracearr-db-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /mnt/application-pool/k3s-app-data/tracearr-db
    server: 192.0.2.30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-db-pvc
  namespace: tools
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: tracearr-db-pv
