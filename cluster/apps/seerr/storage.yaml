apiVersion: v1
kind: PersistentVolume
metadata:
  name: seerr-config-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
  - nfsvers=4.1
  - hard
  nfs:
    server: 192.0.2.30
    path: /mnt/application-pool/k3s-app-data/seerr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: tools
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: seerr-config-pv
  resources:
    requests:
      storage: 5Gi
