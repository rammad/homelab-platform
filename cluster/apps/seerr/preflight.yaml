apiVersion: batch/v1
kind: Job
metadata:
  name: seerr-nfs-check
  namespace: tools
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: permissions
        image: ghcr.io/seerr-team/seerr:v3.5.1
        command:
        - node
        - -e
        - "const fs = require('fs');\nfor (const f of ['/app/config/settings.json',\
          \ '/app/config/db/db.sqlite3']) {\n  fs.accessSync(f, fs.constants.R_OK\
          \ | fs.constants.W_OK);\n  if (!fs.statSync(f).size) throw new Error('Empty\
          \ required file: '+f);\n}\nfor (const d of ['/app/config','/app/config/db','/app/config/logs','/app/config/cache'])\
          \ {\n  const f=d+'/.seerr-permission-check-'+process.pid;\n  try {\n   \
          \ fs.writeFileSync(f,'permission check',{flag:'wx',mode:0o600});\n    fs.renameSync(f,f+'.renamed');\n\
          \    fs.unlinkSync(f+'.renamed');\n  } finally {\n    if(fs.existsSync(f))\
          \ fs.unlinkSync(f);\n    if(fs.existsSync(f+'.renamed')) fs.unlinkSync(f+'.renamed');\n\
          \  }\n}\nconsole.log('NFS read/write/rename/delete OK as UID '+process.getuid());\n"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: seerr-config
