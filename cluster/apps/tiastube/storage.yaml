apiVersion: v1
kind: PersistentVolume
metadata:
  name: tiastube-data-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard]
  nfs:
    server: 192.0.2.30
    path: /mnt/application-pool/k3s-app-data/tiastube
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiastube-data
  namespace: tools
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: tiastube-data-pv
  resources:
    requests:
      storage: 5Gi
