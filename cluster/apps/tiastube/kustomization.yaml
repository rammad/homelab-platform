apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools
resources:
  - storage.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: tiastube-code
    files:
      - source/app.py
      - source/maintenance.py
  - name: tiastube-static
    files:
      - source/static/index.html
      - source/static/app.js
      - source/static/style.css
