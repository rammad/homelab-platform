apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-html-pv
spec:
  capacity:
    storage: 4Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    name: nextcloud-html
    namespace: data
  mountOptions:
  - hard
  - nfsvers=4.1
  nfs:
    server: 192.0.2.30
    path: /mnt/application-pool/k3s-app-data/nextcloud/html
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: data
spec:
  storageClassName: ''
  volumeName: nextcloud-html-pv
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 4Gi
---
