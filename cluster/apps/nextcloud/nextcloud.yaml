apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: nextcloud
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: control-plane
      containers:
      - name: nextcloud
        image: nextcloud:31.0.9-apache
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - 'su -s /bin/sh www-data -c ''php /var/www/html/occ status --output=json''
              | php -r ''$s=json_decode(stream_get_contents(STDIN),true); exit(!empty($s["installed"])
              && empty($s["maintenance"]) && empty($s["needsDbUpgrade"]) ? 0 : 1);'''
          periodSeconds: 30
          timeoutSeconds: 15
        command:
        - apache2-foreground
        env:
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-cache-auth
              key: password
        - name: REDIS_HOST
          value: nextcloud-cache
        - name: PHP_MEMORY_LIMIT
          value: 512M
        - name: PHP_UPLOAD_LIMIT
          value: 3G
        volumeMounts: &id002
        - name: html
          mountPath: /var/www/html
        - name: files
          mountPath: /var/www/html/data
      volumes:
      - name: html
        persistentVolumeClaim:
          claimName: nextcloud-html
      - name: files
        persistentVolumeClaim:
          claimName: nextcloud-files
      initContainers:
      - name: check-install
        image: nextcloud:31.0.9-apache
        command:
        - sh
        - -ec
        - 'test -s config/config.php && test -s config/zzz-k3s.config.php && test
          -r data/.ncdata && test -w data && php -r ''require "version.php"; exit($OC_VersionString
          === "31.0.9" ? 0 : 1);'''
        workingDir: /var/www/html
        securityContext:
          runAsUser: 33
          runAsGroup: 33
        volumeMounts: *id002
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: data
spec:
  selector:
    app: nextcloud
  ports:
  - port: 80
    targetPort: 80
