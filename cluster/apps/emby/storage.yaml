apiVersion: v1
kind: PersistentVolume
metadata:
  name: emby-config-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
  - nfsvers=4.1
  - hard
  nfs:
    server: 192.0.2.30
    path: /mnt/application-pool/k3s-app-data/emby
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-config
  namespace: media
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: emby-config-pv
  resources:
    requests:
      storage: 10Gi
