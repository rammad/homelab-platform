apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: emby-edge
  namespace: media
spec:
  secretName: emby-edge-tls
  dnsNames:
  - stream.example.com
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emby-edge-https
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.options: media-emby-http1@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - stream.example.com
    secretName: emby-edge-tls
  rules:
  - host: stream.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emby
            port:
              number: 8096
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: emby-http1
  namespace: media
spec:
  minVersion: VersionTLS12
  alpnProtocols:
  - http/1.1
