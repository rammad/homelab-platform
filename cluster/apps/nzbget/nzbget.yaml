apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: control-plane
      containers:
      - name: nzbget
        image: lscr.io/linuxserver/nzbget@sha256:ab18af1d16027fdf870fc58a39bbc764043b16e9220e06b9d0413e8b56bd622b
        ports:
        - name: http
          containerPort: 6789
        readinessProbe:
          tcpSocket:
            port: http
        env:
        - name: PUID
          value: "568"
        - name: PGID
          value: "568"
        - name: TZ
          value: "America/New_York"
        - name: NZBGET_USER
          valueFrom:
            secretKeyRef:
              name: nzbget-credentials
              key: NZBGET_USER
        - name: NZBGET_PASS
          valueFrom:
            secretKeyRef:
              name: nzbget-credentials
              key: NZBGET_PASS
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media-data
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: nzbget-config
      - name: media
        persistentVolumeClaim:
          claimName: arr-media
