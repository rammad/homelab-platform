# Partial ConfigMap: server-side apply manages only the declared data key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  resource.exclusions: "- apiGroups:\n  - ''\n  - discovery.k8s.io\n  kinds:\n  -\
    \ Endpoints\n- apiGroups:\n  - coordination.k8s.io\n  kinds:\n  - Lease\n- apiGroups:\n\
    \  - authentication.k8s.io\n  - authorization.k8s.io\n  kinds:\n  - SelfSubjectReview\n\
    \  - TokenReview\n  - LocalSubjectAccessReview\n  - SelfSubjectAccessReview\n\
    \  - SelfSubjectRulesReview\n  - SubjectAccessReview\n- apiGroups:\n  - certificates.k8s.io\n\
    \  kinds:\n  - CertificateSigningRequest\n- apiGroups:\n  - cert-manager.io\n\
    \  kinds:\n  - CertificateRequest\n- apiGroups:\n  - cilium.io\n  kinds:\n  -\
    \ CiliumIdentity\n  - CiliumEndpoint\n  - CiliumEndpointSlice\n- apiGroups:\n\
    \  - kyverno.io\n  - reports.kyverno.io\n  - wgpolicyk8s.io\n  kinds:\n  - PolicyReport\n\
    \  - ClusterPolicyReport\n  - EphemeralReport\n  - ClusterEphemeralReport\n  -\
    \ AdmissionReport\n  - ClusterAdmissionReport\n  - BackgroundScanReport\n  - ClusterBackgroundScanReport\n\
    \  - UpdateRequest\n"
