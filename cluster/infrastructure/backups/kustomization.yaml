apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- storage.yaml
- cronjobs.yaml
- monitor.yaml
- k3s-cronjob.yaml
configMapGenerator:
- name: postgres-backup-script
  namespace: backups
  files:
  - backup-postgres.sh
  - retain-backups.sh
- name: backup-monitor-script
  namespace: backups
  files:
  - backup-monitor.py
- name: k3s-backup-script
  namespace: backups
  files:
  - backup-k3s.py
  - retain-backups.sh
