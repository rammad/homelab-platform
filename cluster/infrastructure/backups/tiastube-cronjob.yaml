apiVersion: batch/v1
kind: CronJob
metadata:
  name: tiastube-backup
  namespace: backups
spec:
  schedule: 0 2 * * *
  timeZone: America/Los_Angeles
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            kubernetes.io/hostname: control-plane
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
            command:
            - python
            - -B
            - /scripts/backup-tiastube.py
            env:
            - name: PYTHONUNBUFFERED
              value: '1'
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
                add:
                - SETUID
                - SETGID
                - CHOWN
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: '1'
                memory: 512Mi
            volumeMounts:
            - name: backups
              mountPath: /backups
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: source
              mountPath: /source
              readOnly: true
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: cluster-backups
          - name: script
            configMap:
              name: tiastube-backup-script
          - name: tmp
            emptyDir:
              sizeLimit: 512Mi
          - name: source
            nfs:
              server: 192.0.2.30
              path: /mnt/application-pool/k3s-app-data/tiastube
              readOnly: true
