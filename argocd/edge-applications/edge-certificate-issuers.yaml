apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-certificate-issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/homelab-platform.git
    targetRevision: HEAD
    path: cluster/infrastructure/certificate-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - FailOnSharedResource=true
