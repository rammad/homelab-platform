apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openspeedtest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rammad/homelab-platform.git
    targetRevision: HEAD
    path: cluster/apps/openspeedtest
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - FailOnSharedResource=true
